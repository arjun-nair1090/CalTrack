<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CalTrack</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <h1 class="login-heading">Welcome Back!</h1>
            <p class="login-text">Login to your CalTrack account and keep tracking your meals easily.</p>
            <img src="your-image.png" alt="Food Scanning" class="login-image">
        </div>
        <div class="login-right">
            <h2>Login to CalTrack</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <p class="signup-text">Don't have an account? <a href="signup.html">Sign up here</a></p>
            </form>
        </div>
    </div>

    <script>
        // Redirect to homepage on form submission
        document.getElementById('login-form').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent default form submission
            window.location.href = "index.html"; // Redirect to the homepage
        });
    </script>
</body>
</html>
