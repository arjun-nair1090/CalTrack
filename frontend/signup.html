<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account · CalTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header class="top"><a class="wordmark" href="/">CalTrack</a></header>
    <main class="auth">
        <form class="label" data-endpoint="/api/auth/signup">
            <h2>Create an account</h2>
            <div class="rule"></div>
            <label class="field"><span>Name</span><input name="name" autocomplete="name" required></label>
            <label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
            <label class="field"><span>Password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
            <button class="go" type="submit">Create account</button>
            <p class="error" role="alert"></p>
        </form>
        <p class="swap">Already have one? <a href="login">Log in</a></p>
    </main>
    <script src="auth.js"></script>
</body>
</html>
